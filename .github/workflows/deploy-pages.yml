name: 🌐 Desplegar Panel Web en GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Preparar artefacto estático (public + data)
        run: |
          mkdir -p _site/data
          cp -r public/* _site/
          cp data/config.json _site/data/config.json
          cp data/processed_bills.json _site/data/processed_bills.json

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: 🚀 Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
